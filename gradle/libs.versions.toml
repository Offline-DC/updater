# Pinned to the same AGP and Kotlin as the launcher repo, so this builds the
# same APK the launcher bundles as assets/updater.apk.
[versions]
agp = "8.13.2"
kotlin = "2.1.10"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
